name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# rust-cache keeps Cargo downloads and compiled dependencies, keyed by the
# compiler, Cargo manifests/lockfile, configuration, and build environment.
# PRs restore main's caches and can save caches scoped to their own PR.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check-doc-translations.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p biosmod-core -p biosmod-host -p biosmod-cli --all-targets -- -D warnings
      - run: cargo run --locked --quiet -- catalog index catalog --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Clippy runs on Linux only; this catches platform-specific warnings elsewhere.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: nextest@0.9.150
      - run: cargo nextest run --locked --profile ci -p biosmod-core -p biosmod-host -p biosmod-cli
      - run: cargo test --locked --doc -p biosmod-core -p biosmod-host -p biosmod-cli
      - name: Smoke test the offline workflow
        shell: bash
        run: |
          set -euo pipefail
          export BME_CONFIG_HOME="$RUNNER_TEMP/c" BME_CACHE_HOME="$RUNNER_TEMP/k" BME_DATA_HOME="$RUNNER_TEMP/d"
          bme() { cargo run --locked --quiet -- "$@"; }
          bme dev synthetic -o "$RUNNER_TEMP/syn"
          bme catalog add lab "$RUNNER_TEMP/syn/catalog" --allow-unsigned-local
          bme scan "$RUNNER_TEMP/syn/synthetic.bin" --catalog lab --json > /dev/null
          bme patch "$RUNNER_TEMP/syn/synthetic.bin" lab::PA lab::DG --offline
          bme verify "$RUNNER_TEMP/syn/synthetic.bin" "$RUNNER_TEMP/syn/synthetic.patched.bin" --json
          bme export "$RUNNER_TEMP/syn/synthetic.bin" lab::PA lab::DG -o "$RUNNER_TEMP/selection.json"
          bme patch "$RUNNER_TEMP/syn/synthetic.bin" --from "$RUNNER_TEMP/selection.json" -o "$RUNNER_TEMP/replay.bin" --offline
          cmp "$RUNNER_TEMP/syn/synthetic.patched.bin" "$RUNNER_TEMP/replay.bin"
          # Read-only on every OS: no programmer is started.
          bme flash doctor --json > /dev/null

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked -p biosmod-core -p biosmod-host -p biosmod-cli --all-targets

  gui-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      SLINT_COMPILER_DENY_WARNINGS: 1
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-x11-dev libdbus-1-dev xvfb weston
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: nextest@0.9.150
      - run: cargo install slint-tr-extractor --version 1.18.1 --locked
      - run: python3 tools/update-gui-translations.py --check
      - run: cargo build --locked -p biosmod-cli -p biosmod-gui
      - run: cargo clippy --locked -p biosmod-gui --all-targets -- -D warnings
      - run: cargo nextest run --locked --profile ci -p biosmod-gui
      - run: cargo test --locked --doc -p biosmod-gui
      - name: X11 software renderer
        run: |
          env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software xvfb-run -a timeout 20s target/debug/bme-gui --smoke-test
          for language in en pt-BR; do
            env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software BME_GUI_NATIVE_SMOKE=1 BME_GUI_LANGUAGE="$language" BME_GUI_SCREENSHOT="$RUNNER_TEMP/gui-x11-$language.png" xvfb-run -a cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test ui_workflow --test keyboard
          done
          env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software BME_GUI_NATIVE_RESIZE=1 xvfb-run -a cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test gallery resizing_open_paths_preserves_the_minimum_window
      - name: Native Wayland software renderer
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/bme-wayland"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --width=1920 --height=1440 --socket=bme-ci --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/bme-ci" ]] && break
            kill -0 "$weston_pid"
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/bme-ci"
          env -u DISPLAY WAYLAND_DISPLAY=bme-ci SLINT_BACKEND=winit-software timeout 20s target/debug/bme-gui --smoke-test
          for language in en pt-BR; do
            env -u DISPLAY WAYLAND_DISPLAY=bme-ci SLINT_BACKEND=winit-software BME_GUI_NATIVE_SMOKE=1 BME_GUI_LANGUAGE="$language" BME_GUI_SCREENSHOT="$RUNNER_TEMP/gui-wayland-$language.png" cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test ui_workflow --test keyboard
          done
          out="$RUNNER_TEMP/gui-gallery/wayland/pt-BR/760x600/theme-2-scale-1.5"
          mkdir -p "$out"
          env -u DISPLAY WAYLAND_DISPLAY=bme-ci SLINT_BACKEND=winit-software SLINT_SCALE_FACTOR=1.5 BME_GUI_NATIVE_SMOKE=1 BME_GUI_LANGUAGE=pt-BR BME_GUI_SIZE=760x600 BME_GUI_THEME=2 BME_GUI_GALLERY="$out" cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test gallery gallery_states_build_and_capture
      - name: State gallery on X11
        shell: bash
        run: |
          set -euo pipefail
          for language in en pt-BR; do
            for size in 760x600 1080x780; do
              for theme in 1 2; do
                out="$RUNNER_TEMP/gui-gallery/$language/$size/theme-$theme"
                mkdir -p "$out"
                env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software BME_GUI_NATIVE_SMOKE=1 BME_GUI_LANGUAGE="$language" BME_GUI_SIZE="$size" BME_GUI_THEME="$theme" BME_GUI_GALLERY="$out" xvfb-run -a cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test gallery gallery_states_build_and_capture
              done
            done
          done
      - name: Scaled Portuguese gallery on X11
        shell: bash
        run: |
          out="$RUNNER_TEMP/gui-gallery/pt-BR/760x600/theme-2-scale-1.5"
          mkdir -p "$out"
          env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software SLINT_SCALE_FACTOR=1.5 BME_GUI_NATIVE_SMOKE=1 BME_GUI_LANGUAGE=pt-BR BME_GUI_SIZE=760x600 BME_GUI_THEME=2 BME_GUI_GALLERY="$out" xvfb-run -a cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test gallery gallery_states_build_and_capture
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gui-gallery
          path: ${{ runner.temp }}/gui-gallery
          if-no-files-found: error
      - name: Build Linux archive
        run: ./packaging/linux/archive.sh
      - name: Smoke test packaged pair
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          package_roots=("$RUNNER_TEMP"/biosmod-engine-*-linux-x86_64)
          test "${#package_roots[@]}" -eq 1
          package_root=${package_roots[0]}
          test -f "$package_root/share/licenses/biosmod-engine/third-party/THIRD-PARTY.txt"
          python3 tools/check-doc-translations.py --root "$package_root"
          test -f "$package_root/README.pt-BR.md"
          test -f "$package_root/docs/pt-BR/guide/gui.md"
          mkdir -p "$RUNNER_TEMP/package-config/biosmod-engine"
          printf '%s\n' '{"language":"pt-BR"}' > "$RUNNER_TEMP/package-config/biosmod-engine/gui.json"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/package-config"
          env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software xvfb-run -a timeout 20s "$package_root/bin/bme-gui" --smoke-test
          for language in en pt-BR; do
            env -u WAYLAND_DISPLAY SLINT_BACKEND=winit-software BME_GUI_NATIVE_SMOKE=1 BME_GUI_LANGUAGE="$language" BME_TEST_ENGINE="$package_root/bin/bme" xvfb-run -a cargo nextest run --locked --profile ci --test-threads 1 -p biosmod-gui --test ui_workflow --test keyboard
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-gui-diagnostics
          path: |
            ${{ runner.temp }}/gui-*.png
            ${{ runner.temp }}/weston.log
