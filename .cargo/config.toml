# Dependency cooldown: when Cargo resolves or updates the lockfile it skips
# crate versions published less than three days ago, so a compromised or
# broken release has time to be noticed and yanked before it is locked here.
# `--locked` builds never resolve, so they use Cargo.lock as committed. Cargo
# reads this from 1.100; the 1.88 and 1.92 minimum-version jobs ignore the
# key.
#
# To take a fix sooner, run that one update with
# `CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow`. The hold applies again to
# the next `cargo update` that unlocks that crate: a plain `cargo update`
# steps back from a locked version that is still under three days old, while
# `cargo update -p <other crate>` leaves it alone.
[registry]
global-min-publish-age = "3 days"
