[package]
name = "biosmod-gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version = "1.92"
description = "A native desktop client for the bme firmware workflow"

[[bin]]
name = "bme-gui"
path = "src/main.rs"

[dependencies]
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
serde.workspace = true
serde_json.workspace = true
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-18",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
  "accessibility",
] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
png = "0.18.1"
