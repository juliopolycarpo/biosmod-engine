[package]
name = "biosmod-cli"
description = "The bme command: inspect firmware images, plan guarded patches and verify outputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "bme"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

[dependencies]
biosmod-core.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minisign-verify = "0.3.0"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse", "display"] }
tempfile = "3.27.0"
sha2.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
blake2 = { version = "0.10", default-features = false, features = ["std"] }
base64 = "0.22"
jsonschema = { version = "0.61.0", default-features = false }
tempfile = "3.27.0"
