[package]
name = "biosmod-cli"
version.workspace = true
authors.workspace = true
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The bme command: inspect firmware images, plan guarded patches and verify outputs"

[[bin]]
name = "bme"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

[dependencies]
biosmod-core.workspace = true
biosmod-host.workspace = true
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
  "derive",
] }
minisign-verify = "0.3.0"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27.0"
toml = { version = "1.2.1", default-features = false, features = [
  "std",
  "serde",
  "parse",
  "display",
] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
biosmod-host = { workspace = true, features = ["testkit"] }
base64 = "0.22"
blake2 = { version = "0.10", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
jsonschema = { version = "0.61.0", default-features = false }
tempfile = "3.27.0"
