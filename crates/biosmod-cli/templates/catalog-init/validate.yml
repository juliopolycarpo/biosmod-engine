# Written by `bme catalog init`.
#
{engine_note}
name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The cache keeps ~/.cargo/bin, so an unchanged engine commit restores bme
      # instead of rebuilding it.
      - id: engine
        run: |
{engine_commit_step}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bme-${{ steps.engine.outputs.commit }}
      - run: cargo install --locked --git https://github.com/juliopolycarpo/biosmod-engine {engine_install_ref} biosmod-cli
      - run: bme catalog index . --check
      - run: bme catalog validate .
