[package]
name = "biosmod-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reads of the running machine for bme diag: sysfs, kernel log, I/O ports and receipts"

[features]
# Named fakes (FakeSysfs, FakeKernelLog, ...) for tests in other crates.
testkit = ["dep:tempfile"]

[dependencies]
biosmod-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { version = "3.27.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
